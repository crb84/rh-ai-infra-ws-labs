    // Populate dropdown links with dynamic values
    function populateDropdownLinks() {
      const clusterDomain = localStorage.getItem('CLUSTER_DOMAIN') ? localStorage.getItem('CLUSTER_DOMAIN') : '<CLUSTER_DOMAIN>';
      const gitServer = localStorage.getItem('GIT_SERVER') ? localStorage.getItem('GIT_SERVER') : '<GIT_SERVER>';
      const username = localStorage.getItem('USER_NAME') ? localStorage.getItem('USER_NAME') : '<USER_NAME>';
      const password = localStorage.getItem('PASSWORD') ? localStorage.getItem('PASSWORD') : '<PASSWORD>';      
      const prompt= localStorage.getItem('PROMPT') ? localStorage.getItem('PROMPT') : '<PROMPT>';      
      const linksContainer = document.getElementById('dynamic-links');
      if (!linksContainer) return;
      
      // Clear existing links
      linksContainer.innerHTML = '';
      
      // Add dynamic links
      const links = [
        // { name: '☕️ Git Server', url: `https://${gitServer}` },
        { name: '📺 OpenShift Console', url: `https://console-openshift-console.${clusterDomain}` },
        { name: '🧠 OpenShift AI Dashboard', url: `https://data-science-gateway.${clusterDomain}` },
        // { name: '🐙 Argo CD', url: `https://argocd-server-${username}-toolings.${clusterDomain}` },
        // { name: '🦙 Prompt Tracker', url: `https://prompt-tracker-ai501.${clusterDomain}/${username}/${clusterDomain}` }
      ];
      
      links.forEach(link => {
        const a = document.createElement('a');
        a.href = link.url;
        a.textContent = link.name;
        a.target = '_blank'; // Open in new tab
        linksContainer.appendChild(a);
      });
    }

    // Call once on page load
    document.addEventListener('DOMContentLoaded', populateDropdownLinks);
    
    function setNamesInStorage () {
      let uname = document.getElementById('uname').value.toLowerCase();
      let pass = document.getElementById('pass').value;
      let prompt = document.getElementById('prompt').value;
      let cdomain = (document.getElementById('cdomain').value.toLowerCase().indexOf('https://') > -1) 
                    ? document.getElementById('cdomain').value.toLowerCase().substring(8).replace(/[\/,&,?]/g, "")  
                    : document.getElementById('cdomain').value.toLowerCase().replace(/[\/,&,?]/g, "");
      let gitserver = (document.getElementById('gitserver').value.toLowerCase().indexOf('https://') > -1) 
                    ? document.getElementById('gitserver').value.toLowerCase().substring(8) 
                    : document.getElementById('gitserver').value.toLowerCase();

      // Check inputs
      if (uname == '') {        
         alert('Please enter a username');
         return;
      }
      // if (pass == '') {        
      //   alert('Please enter your password');
      //   return;
      // }
      // if (cdomain == '') {        
      //   alert('Please enter a cluster domain');
      //   return;
      // }

      console.info('INFO - setting user, cluster and git to :', uname, pass, cdomain, gitserver);
      localStorage.setItem('USER_NAME', uname);
      localStorage.setItem('PASSWORD', pass);
      localStorage.setItem('CLUSTER_DOMAIN', cdomain);
      localStorage.setItem('PROMPT', prompt);
      // gitserver is not nullable
      if (gitserver !== '') {
        localStorage.setItem('GIT_SERVER', gitserver);
      } else {
        // Default GitLab Server
        localStorage.setItem('GIT_SERVER', 'gitea-gitea.' + cdomain);
      }

      // If gitserver field is using the default pattern, update it with new cluster domain
      if (gitserver === '' || gitserver.startsWith('gitea-gitea.')) {
        localStorage.setItem('GIT_SERVER', 'gitea-gitea.' + cdomain);
      }
      location.reload();
      // Re-populate dropdown links with new values
      populateDropdownLinks();
    }

    function clearStorage () {
      console.info('INFO - clearing user and cluster');
      localStorage.removeItem('USER_NAME');
      localStorage.removeItem('PROMPT');
      localStorage.removeItem('PASSWORD');
      localStorage.removeItem('CLUSTER_DOMAIN');
      localStorage.removeItem('GIT_SERVER');
      document.getElementById('uname').value = '';
      document.getElementById('pass').value = '';
      document.getElementById('prompt').value = '';
      document.getElementById('cdomain').value = '';
      document.getElementById('gitserver').value = '';
      location.reload();
      // Update dropdown links after clearing storage
      populateDropdownLinks();
    }

    /**
     * Replace <TOKEN> in rendered HTML. Docsify :include files are inlined after
     * hook.beforeEach runs, so placeholders in embedded markdown must be replaced here.
     * Replaces both literal <TOKEN> and &lt;TOKEN&gt; (fenced code blocks / Prism).
     */
    function escapeForHtmlText(s) {
      if (s == null) {
        return '';
      }
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function applyDocPlaceholdersToHtml(html) {
      if (!html) {
        return html;
      }
      const tokens = [
        { name: 'USER_NAME', key: 'USER_NAME' },
        { name: 'PASSWORD', key: 'PASSWORD' },
        { name: 'CLUSTER_DOMAIN', key: 'CLUSTER_DOMAIN' },
        { name: 'PROMPT', key: 'PROMPT' },
        { name: 'GIT_SERVER', key: 'GIT_SERVER' }
      ];
      var out = html;
      for (var i = 0; i < tokens.length; i++) {
        var t = tokens[i].name;
        var raw = localStorage.getItem(tokens[i].key);
        var v = (raw != null && raw !== '') ? raw : ('<' + t + '>');
        var sub = escapeForHtmlText(v);
        var reEsc = new RegExp('&lt;' + t + '&gt;', 'g');
        out = out.replace(reEsc, sub);
        out = out.split('<' + t + '>').join(sub);
      }
      // <API_URL> is derived from the cluster domain: apps.ocp.example.com -> https://api.ocp.example.com:6443
      var domain = localStorage.getItem('CLUSTER_DOMAIN');
      if (domain) {
        var apiUrl = escapeForHtmlText('https://api.' + domain.replace(/^apps\./, '') + ':6443');
        out = out.replace(/&lt;API_URL&gt;/g, apiUrl).split('<API_URL>').join(apiUrl);
      }
      return out;
    }

    // Custom Gradio component function
    function createGradioEmbed(container, appUrl) {
      const iframe = document.createElement('iframe');
      iframe.src = appUrl;
      iframe.style.width = '100%';
      iframe.style.height = '600px';
      iframe.style.border = '1px solid #ddd';
      iframe.style.borderRadius = '8px';
      iframe.frameBorder = '0';
      container.appendChild(iframe);
    }

    window.$docsify = {
      auto2top: true,
      executeScript: true,
      name: 'Red Hat Openshift AI Infrastructure Workshop 🚀',
      repo: 'https://github.com/crb84/rh-ai-infra-ws-labs/tree/docs/2.2.4-dra-gpucluster',
      loadSidebar: true,
      subMaxLevel: 0,
      sidebarDisplayLevel: 0,
      alias: {
      '/.*/_sidebar.md': '/_sidebar.md'
      },
      copyCode: {
        buttonText : '✂️',
        errorText  : '😔',
        successText: '💚 copied'
      },
      pagination: {
        crossChapter: true
    },
      plugins: [
        function(hook, vm) {
          // docsify-pagination counts sidebar anchor entries (page.md#section) as separate pages,
          // so NEXT/PREVIOUS point to the same page. Rebuild them using one link per page.
          hook.doneEach(function() {
            var container = document.querySelector('.docsify-pagination-container');
            if (!container) return;

            function pathOf(a) {
              var p = decodeURIComponent(a.getAttribute('href').split('?')[0]);
              return p.toUpperCase() === '#/README' ? '#/' : p;
            }

            var seen = {};
            var pages = Array.prototype.slice.call(document.querySelectorAll('.sidebar-nav li a'))
              .filter(function(a) { return !a.classList.contains('section-link'); })
              .filter(function(a) {
                var p = pathOf(a);
                if (seen[p]) return false;
                seen[p] = true;
                return true;
              });

            var current = decodeURIComponent(vm.router.toURL(vm.route.path));
            if (current.toUpperCase() === '#/README') current = '#/';
            var idx = pages.findIndex(function(a) { return pathOf(a) === current; });
            if (idx === -1) return;

            function item(a, kind, label) {
              var arrow = kind === 'next'
                ? '<svg width="10" height="16" viewBox="0 0 10 16" xmlns="http://www.w3.org/2000/svg"><polyline fill="none" vector-effect="non-scaling-stroke" points="2,2 8,8 2,14"/></svg>'
                : '<svg width="10" height="16" viewBox="0 0 10 16" xmlns="http://www.w3.org/2000/svg"><polyline fill="none" vector-effect="non-scaling-stroke" points="8,2 2,8 8,14"/></svg>';
              var inner = kind === 'next' ? '<span>' + label + '</span>' + arrow : arrow + '<span>' + label + '</span>';
              return '<div class="pagination-item pagination-item--' + (kind === 'next' ? 'next' : 'previous') + '">' +
                '<a href="' + a.getAttribute('href') + '"' + (a.getAttribute('target') === '_blank' ? ' target="_blank"' : '') + '>' +
                '<div class="pagination-item-label">' + inner + '</div>' +
                '<div class="pagination-item-title">' + a.innerText + '</div></a></div>';
            }

            container.innerHTML =
              (pages[idx - 1] ? item(pages[idx - 1], 'previous', 'PREVIOUS') : '') +
              (pages[idx + 1] ? item(pages[idx + 1], 'next', 'NEXT') : '');
          });

          hook.beforeEach(function(content) {

            fetch('config/all.json')
            .then(function(response) {
              return response.json();
            }).then(function(jsonData) {
              console.info("🥳 YAY! Found the config file 🥳", jsonData);
              document.getElementById('crw_dev_filelocation').setAttribute('href', jsonData.devfile);
              document.getElementById('crw_dev_filelocation').innerHTML = jsonData.devfile;
              document.getElementById('crw_dev_filelocation_4.11').setAttribute('href', jsonData.devfile411);
              document.getElementById('crw_dev_filelocation_4.11').innerHTML = jsonData.devfile411;
            }).catch(function(err) {
              console.warn("😭 Opps, Cannot find the config file 😭", err);
            })

            // Invoked each time before parsing the Markdown file.
            // Per-page placeholders: only runs on the top-level .md, not on :include files.
            // USER_NAME, CLUSTER_DOMAIN, etc. are applied in hook.afterEach (applyDocPlaceholdersToHtml).
            return content
                    .replaceAll('<GRADIO_EMBED>', '<div id="gradio-app-container"></div>');
          });

          // Add hook to handle Gradio embedding after content is rendered
          hook.doneEach(function() {
            const container = document.getElementById('gradio-app-container');
            if (container && !container.hasChildNodes()) {
              // Replace with your actual Gradio app URL
              createGradioEmbed(container, 'https://your-gradio-app-url.com');
            }
          });

          // const footer = `<hr/>
          //   <footer>
          //   <span><a href="https://github.com/rhoai-genaiops"> 🤖 GenAIOps Git Repository</a> </span>
          //   </footer>
          //   `;

          hook.afterEach(function(html) {
            // return applyDocPlaceholdersToHtml(html) + footer;
            return applyDocPlaceholdersToHtml(html);
          });
        },
        function(hook, vm) {
          // Keep the rendered page (preview) and the raw Markdown (source) on screen together.
          var SOURCE_BRANCH = 'docs/2.2.4-dra-gpucluster';
          var SOURCE_REPO = 'https://github.com/crb84/rh-ai-infra-ws-labs/blob/' + SOURCE_BRANCH + '/docs/';

          function slugify(text) {
            return text.toString().toLowerCase().trim()
              .replace(/\s+/g, '-')
              .replace(/[^\w\u00C0-\u024f\-]+/g, '')
              .replace(/-+/g, '-')
              .replace(/^-+|-+$/g, '');
          }

          function ensurePanel() {
            var panel = document.getElementById('lab-source-panel');
            if (panel) return panel;
            panel = document.createElement('aside');
            panel.id = 'lab-source-panel';
            panel.setAttribute('aria-label', 'Markdown source');
            panel.innerHTML =
              '<div class="lab-source-bar">' +
                '<span>Source</span>' +
                '<span class="lab-source-actions">' +
                  '<a id="lab-source-github" target="_blank" rel="noopener">GitHub</a>' +
                  '<button type="button" id="lab-source-hide">Hide</button>' +
                '</span>' +
              '</div>' +
              '<pre id="lab-source-pre"></pre>';
            document.body.appendChild(panel);
            var opener = document.createElement('button');
            opener.id = 'lab-source-show';
            opener.type = 'button';
            opener.textContent = 'Source';
            document.body.appendChild(opener);
            document.getElementById('lab-source-hide').addEventListener('click', function() {
              document.body.classList.remove('lab-source-open');
            });
            opener.addEventListener('click', function() {
              document.body.classList.add('lab-source-open');
            });
            if (window.matchMedia('(min-width: 1200px)').matches) {
              document.body.classList.add('lab-source-open');
            }
            return panel;
          }

          hook.doneEach(function() {
            ensurePanel();
            var file = (vm.route.file || 'README.md').replace(/^\//, '');
            var pre = document.getElementById('lab-source-pre');
            var github = document.getElementById('lab-source-github');
            github.href = SOURCE_REPO + file;
            pre.textContent = 'Loading ' + file + '…';
            fetch(file)
              .then(function(response) {
                if (!response.ok) throw new Error(response.status);
                return response.text();
              })
              .then(function(text) {
                pre.textContent = text;
                var wanted = '';
                var query = (location.hash.split('?')[1] || '');
                query.split('&').forEach(function(part) {
                  if (part.indexOf('id=') === 0) wanted = decodeURIComponent(part.slice(3));
                });
                if (!wanted) return;
                var lines = text.split('\n');
                var line = 0;
                for (var i = 0; i < lines.length; i++) {
                  var match = /^(#{1,6})\s+(.*)$/.exec(lines[i]);
                  if (match && slugify(match[2]) === slugify(wanted)) {
                    line = i;
                    break;
                  }
                }
                pre.scrollTop = Math.max(0, line * 18 - 24);
              })
              .catch(function() {
                pre.textContent = 'Could not load ' + file;
              });
          });
        }
      ],
      search: 'auto', // default
      vueComponents: { }
    }    
  </script>
